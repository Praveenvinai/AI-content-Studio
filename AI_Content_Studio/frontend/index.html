<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascent AI — Creative Studio</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #f5f7f4;
    --sidebar: #edf2ee;
    --card: #ffffff;
    --card-soft: #fafcf9;
    --sage: #6f8f82;
    --sage-dark: #365a50;
    --sage-light: #e3eee8;
    --blue: #6f8fa3;
    --blue-light: #e8f0f5;
    --lavender: #8b7ca8;
    --lavender-light: #efebf6;
    --peach: #b8896c;
    --peach-light: #f8eee7;
    --text: #26322f;
    --text-soft: #65716d;
    --muted: #8b9691;
    --border: #dfe6e1;
    --border-soft: #e9eeeb;
    --shadow: 0 8px 28px rgba(45, 65, 57, 0.055);
}

body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background:
        radial-gradient(circle at 80% 0%, rgba(224, 235, 229, 0.65), transparent 28%),
        var(--bg);
    color: var(--text);
    min-height: 100vh;
}

button,
textarea,
input {
    font-family: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
}

.app {
    display: flex;
    min-height: 100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 225px;
    background: rgba(237, 242, 238, 0.94);
    border-right: 1px solid var(--border);
    padding: 24px 16px;
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    z-index: 20;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 4px 10px 32px;
}

.brand-icon {
    width: 34px;
    height: 34px;
    border-radius: 11px;
    background: linear-gradient(
        145deg,
        #dcebe4,
        #e9edf7
    );
    border: 1px solid #d4e0da;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--sage-dark);
    font-size: 17px;
    box-shadow: 0 4px 10px rgba(61, 89, 77, 0.08);
}

.brand-name {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text);
}

.nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.nav-button {
    width: 100%;
    border: 1px solid transparent;
    background: transparent;
    border-radius: 11px;
    padding: 11px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--text-soft);
    cursor: pointer;
    text-align: left;
    transition:
        background 0.2s,
        color 0.2s,
        border 0.2s,
        transform 0.2s;
}

.nav-button:hover {
    background: rgba(255, 255, 255, 0.7);
    border-color: var(--border);
    color: var(--text);
    transform: translateX(1px);
}

.nav-button.active {
    background: var(--sage-light);
    border-color: #d2e2da;
    color: var(--sage-dark);
    font-weight: 600;
}

.nav-icon {
    width: 20px;
    text-align: center;
    font-size: 15px;
}

.sidebar-bottom {
    position: absolute;
    bottom: 24px;
    left: 16px;
    right: 16px;
}

/* =========================
   MAIN
========================= */

.main {
    margin-left: 225px;
    width: calc(100% - 225px);
    min-height: 100vh;
    padding: 28px 42px 55px;
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    margin-bottom: 25px;
}

.status {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--text-soft);
    font-size: 12px;
    background: rgba(255,255,255,0.65);
    border: 1px solid var(--border-soft);
    padding: 7px 11px;
    border-radius: 20px;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #6f9b7d;
    box-shadow: 0 0 0 3px rgba(111,155,125,0.12);
}

.content {
    max-width: 1060px;
    margin: 0 auto;
}

/* =========================
   HERO
========================= */

.hero {
    text-align: center;
    margin-bottom: 27px;
}

.hero h1 {
    font-size: 29px;
    font-weight: 720;
    letter-spacing: -0.9px;
    color: var(--text);
    margin-bottom: 8px;
}

.hero p {
    color: var(--text-soft);
    font-size: 14px;
}

/* =========================
   CREATOR
========================= */

.creator-card {
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.98),
            rgba(249,252,249,0.98)
        );
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 25px;
    box-shadow: var(--shadow);
}

.idea-box {
    position: relative;
    margin-bottom: 17px;
}

.idea-input {
    width: 100%;
    min-height: 112px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: #fbfcfb;
    padding: 17px 18px;
    outline: none;
    font-size: 14px;
    line-height: 1.65;
    color: var(--text);
    transition:
        border 0.2s,
        background 0.2s,
        box-shadow 0.2s;
}

.idea-input:focus {
    border-color: #b9cec4;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(111, 143, 130, 0.08);
}

.idea-input::placeholder {
    color: #9ba49f;
}

/* =========================
   INPUT TOOLS
========================= */

.input-tools {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.tool-card {
    min-height: 92px;
    border: 1px solid var(--border);
    background: #fbfcfb;
    border-radius: 14px;
    padding: 15px 12px;
    cursor: pointer;
    text-align: center;
    transition:
        transform 0.2s,
        border 0.2s,
        box-shadow 0.2s;
}

.tool-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(52, 75, 65, 0.07);
}

.input-tools .tool-card:nth-child(1) {
    background: linear-gradient(
        145deg,
        #fbfcfa,
        #f5f8f5
    );
}

.input-tools .tool-card:nth-child(2) {
    background: linear-gradient(
        145deg,
        #fbfcfd,
        #f2f7fa
    );
}

.input-tools .tool-card:nth-child(3) {
    background: linear-gradient(
        145deg,
        #fcfbfd,
        #f5f1f9
    );
}

.input-tools .tool-card:nth-child(1):hover {
    border-color: #c9d9cf;
}

.input-tools .tool-card:nth-child(2):hover {
    border-color: #c7d7e1;
}

.input-tools .tool-card:nth-child(3):hover {
    border-color: #d3c9e1;
}

.tool-icon {
    width: 35px;
    height: 35px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 8px;
    font-size: 16px;
}

.input-tools .tool-card:nth-child(1) .tool-icon {
    background: var(--sage-light);
    color: var(--sage-dark);
}

.input-tools .tool-card:nth-child(2) .tool-icon {
    background: var(--blue-light);
    color: #55758a;
}

.input-tools .tool-card:nth-child(3) .tool-icon {
    background: var(--lavender-light);
    color: #74658e;
}

.tool-title {
    font-size: 12px;
    font-weight: 650;
    color: var(--text);
}

.tool-subtitle {
    font-size: 10px;
    color: var(--muted);
    margin-top: 3px;
}

.file-input {
    display: none;
}

.input-status {
    text-align: center;
    color: var(--text-soft);
    font-size: 11px;
    margin-top: 12px;
    min-height: 15px;
}

/* =========================
   GENERATE BUTTON
========================= */

.generate-row {
    display: flex;
    justify-content: center;
    margin-top: 19px;
}

.generate-button {
    border: 1px solid #31564d;
    background: linear-gradient(
        135deg,
        #3e675d,
        #31564d
    );
    color: white;
    border-radius: 10px;
    padding: 11px 34px;
    font-size: 13px;
    font-weight: 650;
    cursor: pointer;
    box-shadow: 0 5px 14px rgba(54, 90, 80, 0.16);
    transition:
        transform 0.2s,
        box-shadow 0.2s,
        background 0.2s;
}

.generate-button:hover {
    transform: translateY(-1px);
    background: linear-gradient(
        135deg,
        #365f55,
        #294c44
    );
    box-shadow: 0 8px 18px rgba(54, 90, 80, 0.2);
}

.generate-button:active {
    transform: translateY(0);
}

.generate-button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    transform: none;
}

/* =========================
   RESULTS
========================= */

.results-section {
    margin-top: 36px;
}

.section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
}

.section-title h2 {
    font-size: 16px;
    font-weight: 680;
    color: var(--text);
}

.section-title span {
    font-size: 11px;
    color: var(--muted);
}

.result-card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 17px;
    padding: 22px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
}

.result-header {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 18px;
}

.result-name {
    font-size: 21px;
    font-weight: 720;
    margin-bottom: 4px;
    color: var(--text);
}

.result-tagline {
    color: var(--text-soft);
    font-size: 13px;
}

.result-badge {
    height: fit-content;
    background: var(--lavender-light);
    color: #70618a;
    border: 1px solid #dfd7eb;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.4px;
}

.brief-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.brief-item {
    background: #f8faf8;
    border: 1px solid #edf1ee;
    border-radius: 12px;
    padding: 14px;
}

.brief-item:nth-child(2) {
    background: #f7fafc;
}

.brief-item:nth-child(3) {
    background: #faf8fc;
}

.brief-item:nth-child(4) {
    background: #fcf9f6;
}

.brief-label {
    font-size: 9px;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.65px;
    font-weight: 650;
}

.brief-value {
    font-size: 12px;
    line-height: 1.6;
    color: #4c5854;
}

.features {
    margin-top: 13px;
}

.feature-list {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.feature {
    background: var(--sage-light);
    border: 1px solid #d9e7df;
    border-radius: 20px;
    padding: 6px 10px;
    font-size: 10px;
    color: #587267;
}

/* =========================
   IMAGE RESULT
========================= */

.image-result {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 17px;
    padding: 18px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
}

.image-preview {
    width: 100%;
    max-height: 520px;
    object-fit: contain;
    display: block;
    border-radius: 13px;
    background:
        linear-gradient(
            145deg,
            #edf3ef,
            #f0edf5
        );
}

.image-actions {
    display: flex;
    gap: 9px;
    margin-top: 13px;
    flex-wrap: wrap;
}

.action-button {
    border: 1px solid var(--border);
    background: #ffffff;
    border-radius: 9px;
    padding: 8px 13px;
    font-size: 11px;
    color: var(--text-soft);
    cursor: pointer;
    transition: 0.2s;
}

.action-button:hover {
    background: #f5f8f5;
    border-color: #cbd7d0;
}

.primary-action {
    background: var(--sage-light);
    color: var(--sage-dark);
    border-color: #cbded4;
    font-weight: 600;
}

/* =========================
   RECENT CREATIONS
========================= */

.recent-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
}

.recent-card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition:
        transform 0.2s,
        box-shadow 0.2s;
}

.recent-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 9px 22px rgba(45, 65, 57, 0.08);
}

.recent-card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    background: #edf2ef;
}

.recent-info {
    padding: 10px;
}

.recent-name {
    font-size: 11px;
    font-weight: 650;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.recent-date {
    font-size: 9px;
    color: var(--muted);
    margin-top: 3px;
}

.empty-recent {
    background: rgba(255,255,255,0.72);
    border: 1px dashed #cfd9d3;
    border-radius: 14px;
    padding: 35px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    grid-column: 1 / -1;
}

/* =========================
   LOADING
========================= */

.loading {
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.spinner {
    width: 13px;
    height: 13px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================
   TOAST
========================= */

.toast {
    position: fixed;
    right: 25px;
    bottom: 25px;
    background: #304b43;
    color: white;
    padding: 11px 15px;
    border-radius: 10px;
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
    transition: 0.25s;
    z-index: 1000;
    box-shadow: 0 8px 25px rgba(40, 62, 54, 0.2);
}

.toast.show {
    opacity: 1;
    transform: translateY(0);
}

/* =========================
   MODAL
========================= */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(34, 48, 43, 0.28);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 999;
}

.modal.show {
    display: flex;
}

.modal-card {
    width: min(650px, 100%);
    max-height: 85vh;
    overflow-y: auto;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(36, 54, 47, 0.16);
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
}

.modal-header h3 {
    font-size: 17px;
}

.close-button {
    border: none;
    background: var(--sage-light);
    color: var(--sage-dark);
    width: 30px;
    height: 30px;
    border-radius: 8px;
    cursor: pointer;
}

.modal-content {
    color: #555;
    font-size: 13px;
    line-height: 1.7;
}

.modal-content pre {
    white-space: pre-wrap;
    word-break: break-word;
    background: #f4f7f5;
    border: 1px solid var(--border);
    padding: 15px;
    border-radius: 10px;
    font-size: 11px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 900px) {

    .sidebar {
        width: 75px;
        padding: 20px 10px;
    }

    .brand {
        justify-content: center;
        padding-left: 0;
        padding-right: 0;
    }

    .brand-name,
    .nav-button span:not(.nav-icon) {
        display: none;
    }

    .nav-button {
        justify-content: center;
        padding: 12px;
    }

    .sidebar-bottom {
        left: 10px;
        right: 10px;
    }

    .main {
        margin-left: 75px;
        width: calc(100% - 75px);
        padding: 25px 20px 45px;
    }

    .recent-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 650px) {

    .main {
        padding: 20px 14px 35px;
    }

    .hero h1 {
        font-size: 24px;
    }

    .creator-card {
        padding: 17px;
    }

    .input-tools {
        grid-template-columns: 1fr;
    }

    .brief-grid {
        grid-template-columns: 1fr;
    }

    .result-header {
        flex-direction: column;
    }

    .recent-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .topbar {
        margin-bottom: 18px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">✦</div>
            <div class="brand-name">Ascent AI</div>
        </div>

        <nav class="nav">

            <button class="nav-button active" onclick="showHome()">
                <span class="nav-icon">⌂</span>
                <span>Home</span>
            </button>

            <button class="nav-button" onclick="focusCreator()">
                <span class="nav-icon">✦</span>
                <span>Create</span>
            </button>

            <button class="nav-button" onclick="showGallery()">
                <span class="nav-icon">▧</span>
                <span>Gallery</span>
            </button>

            <button class="nav-button" onclick="showHistory()">
                <span class="nav-icon">◷</span>
                <span>History</span>
            </button>

        </nav>

        <div class="sidebar-bottom">

            <button class="nav-button" onclick="showSettings()">
                <span class="nav-icon">⚙</span>
                <span>Settings</span>
            </button>

        </div>

    </aside>

    <main class="main">

        <div class="topbar">

            <div class="status">
                <span class="status-dot"></span>
                <span>AI Ready</span>
            </div>

        </div>

        <div class="content">

            <section class="hero">

                <h1>Create Something Amazing</h1>

                <p>
                    Upload, speak or type your idea.
                </p>

            </section>

            <section class="creator-card" id="creator">

                <div class="idea-box">

                    <textarea
                        id="ideaInput"
                        class="idea-input"
                        placeholder="Describe your creative idea..."
                    ></textarea>

                </div>

                <div class="input-tools">

                    <label class="tool-card">

                        <input
                            id="pdfInput"
                            class="file-input"
                            type="file"
                            accept=".pdf"
                            onchange="uploadPDF(this.files[0])"
                        >

                        <div class="tool-icon">▤</div>

                        <div class="tool-title">
                            Upload PDF
                        </div>

                        <div class="tool-subtitle">
                            Creative brief
                        </div>

                    </label>

                    <label class="tool-card">

                        <input
                            id="imageInput"
                            class="file-input"
                            type="file"
                            accept="image/png,image/jpeg,image/webp"
                            onchange="analyzeImage(this.files[0])"
                        >

                        <div class="tool-icon">▧</div>

                        <div class="tool-title">
                            Upload Image
                        </div>

                        <div class="tool-subtitle">
                            Reference image
                        </div>

                    </label>

                    <button
                        class="tool-card"
                        onclick="toggleRecording()"
                    >

                        <div
                            class="tool-icon"
                            id="voiceIcon"
                        >
                            ◉
                        </div>

                        <div
                            class="tool-title"
                            id="voiceTitle"
                        >
                            Record Voice
                        </div>

                        <div
                            class="tool-subtitle"
                            id="voiceSubtitle"
                        >
                            Speak your idea
                        </div>

                    </button>

                </div>

                <div
                    class="input-status"
                    id="inputStatus"
                ></div>

                <div class="generate-row">

                    <button
                        class="generate-button"
                        id="generateButton"
                        onclick="generateCreative()"
                    >
                        ✦ Generate
                    </button>

                </div>

            </section>

            <section
                class="results-section"
                id="resultsSection"
                style="display:none;"
            >

                <div class="section-title">

                    <h2>
                        Creative Result
                    </h2>

                    <span id="resultStatus">
                        Generated
                    </span>

                </div>

                <div id="resultsContainer"></div>

            </section>

            <section class="results-section">

                <div class="section-title">

                    <h2>
                        Recent Creations
                    </h2>

                    <span id="recentCount">
                        0 creations
                    </span>

                </div>

                <div
                    class="recent-grid"
                    id="recentGrid"
                ></div>

            </section>

        </div>

    </main>

</div>

<div
    class="toast"
    id="toast"
></div>

<div
    class="modal"
    id="modal"
>

    <div class="modal-card">

        <div class="modal-header">

            <h3 id="modalTitle">
                Ascent AI
            </h3>

            <button
                class="close-button"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>

        <div
            class="modal-content"
            id="modalContent"
        ></div>

    </div>

</div>

<script>

const API_BASE = "http://127.0.0.1:8000/api";

let pdfContent = "";
let referenceAnalysis = null;
let currentBrief = null;
let currentImagePrompt = null;
let currentImageUrl = null;

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

const ideaInput =
    document.getElementById("ideaInput");

const generateButton =
    document.getElementById("generateButton");

const inputStatus =
    document.getElementById("inputStatus");

const resultsSection =
    document.getElementById("resultsSection");

const resultsContainer =
    document.getElementById("resultsContainer");

const recentGrid =
    document.getElementById("recentGrid");

const recentCount =
    document.getElementById("recentCount");


function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    }, 2500);
}


function setStatus(message) {

    inputStatus.textContent = message;
}


function setLoading(loading) {

    generateButton.disabled = loading;

    if (loading) {

        generateButton.innerHTML = `
            <span class="loading">
                <span class="spinner"></span>
                Creating...
            </span>
        `;

    } else {

        generateButton.innerHTML =
            "✦ Generate";

    }
}


async function generateCreative() {

    const idea =
        ideaInput.value.trim();

    if (
        !idea &&
        !pdfContent &&
        !referenceAnalysis
    ) {

        showToast(
            "Add an idea, PDF or reference image first."
        );

        return;
    }

    setLoading(true);

    setStatus(
        "Creating your creative concept..."
    );

    try {

        const formData =
            new FormData();

        formData.append(
            "idea",
            idea
        );

        formData.append(
            "voice_transcript",
            ""
        );

        formData.append(
            "pdf_content",
            pdfContent
        );

        formData.append(
            "reference_analysis",
            referenceAnalysis
                ? JSON.stringify(referenceAnalysis)
                : ""
        );

        const response =
            await fetch(
                `${API_BASE}/multimodal-concept`,
                {
                    method: "POST",
                    body: formData
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            throw new Error(
                data.message ||
                "Creative generation failed."
            );

        }

        currentBrief =
            data.concept;

        displayCreativeBrief(
            currentBrief
        );

        setStatus(
            "Creative brief ready."
        );

        await createImagePrompt(
            currentBrief
        );

    } catch (error) {

        showToast(
            error.message
        );

        setStatus("");

    } finally {

        setLoading(false);

    }
}

    resultsContainer.innerHTML = `

        <div class="result-card">

            <div class="result-header">

                    <div class="result-name">
                        ${escapeHtml(brief.name)}
                    </div>

                    <div class="result-tagline">
                        ${escapeHtml(brief.tagline)}
                    </div>

                </div>

                <div class="result-badge">
                    CREATIVE BRIEF
                </div>

            </div>

            <div class="brief-grid">

                <div class="brief-item">

                    <div class="brief-label">
                        Concept
                    </div>

                    <div class="brief-value">
                        ${escapeHtml(brief.concept)}
                    </div>

                </div>

                <div class="brief-item">

                    <div class="brief-label">
                        Mood
                    </div>

                    <div class="brief-value">
                        ${escapeHtml(brief.mood)}
                    </div>

                </div>

                <div class="brief-item">

                    <div class="brief-label">
                        Visual Style
                    </div>

                    <div class="brief-value">
                        ${escapeHtml(brief.visual_style)}
                    </div>

                </div>

                <div class="brief-item">

                    <div class="brief-label">
                        Target Audience
                    </div>

                    <div class="brief-value">
                        ${escapeHtml(
                            brief.target_audience

async function createImagePrompt(brief) {

    setStatus(
        "Creating image direction..."
    );

    try {

        const response =
            await fetch(
                `${API_BASE}/create-image-prompt`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        brief: brief
                    })
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            throw new Error(
                data.message ||
                "Image prompt generation failed."
            );

        }

        currentImagePrompt =
            data.image_prompt;

        await generateImage(
            currentImagePrompt
        );

    } catch (error) {

        showToast(
            error.message
        );

        setStatus("");

    }
}


async function generateImage(
    imagePrompt
) {

    setStatus(
        "Generating your image..."
    );

    try {

        const response =
            await fetch(
                `${API_BASE}/generate-image`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        prompt:
                            imagePrompt.prompt,

                        aspect_ratio:
                            imagePrompt.aspect_ratio
                    })
                }
            );

        if (!response.ok) {

            throw new Error(
                "Image generation failed."
            );

        }

        const blob =
            await response.blob();

        currentImageUrl =
            URL.createObjectURL(blob);

        displayGeneratedImage(
            currentImageUrl
        );

        saveRecentCreation(
            currentImageUrl,
            currentBrief?.name ||
            "Untitled Creation"
        );

        setStatus(
            "Your creation is ready."
        );

    } catch (error) {

        showToast(
            error.message
        );

        setStatus("");

    }
}


function displayGeneratedImage(
    imageUrl
) {

    resultsSection.style.display =
        "block";

    const imageHtml = `

        <div class="image-result">

            <img
                src="${imageUrl}"
                class="image-preview"
                alt="Generated creative"
            >

            <div class="image-actions">

                <button
                    class="action-button primary-action"
                    onclick="generateVariation()"
                >
                    ✦ Generate Variation
                </button>

                <button
                    class="action-button"
                    onclick="downloadImage()"
                >
                    ↓ Download
                </button>

                <button
                    class="action-button"
                    onclick="showImagePrompt()"
                >
                    View Prompt
                </button>

                <button
                    class="action-button"
                    onclick="newCreation()"
                >
                    + Create New
                </button>

            </div>

        </div>

    `;

    resultsContainer.insertAdjacentHTML(
        "beforeend",
        imageHtml
    );

    resultsSection.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}


async function generateVariation() {

    if (!currentImagePrompt) {

        showToast(
            "No image prompt available."
        );

        return;
    }

    const button =
        event.target;

    button.disabled = true;

    button.textContent =
        "Generating...";

    try {

        const response =
            await fetch(
                `${API_BASE}/generate-image`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        prompt:
                            currentImagePrompt.prompt,

                        aspect_ratio:
                            currentImagePrompt.aspect_ratio
                    })
                }
            );

        if (!response.ok) {

            throw new Error(
                "Variation generation failed."
            );

        }

        const blob =
            await response.blob();

        currentImageUrl =
            URL.createObjectURL(blob);

        const image =
            document.querySelector(
                ".image-preview"
            );

        if (image) {

            image.src =
                currentImageUrl;

        }

        saveRecentCreation(
            currentImageUrl,
            `${
                currentBrief?.name ||
                "Creation"
            } Variation`
        );

        showToast(
            "New variation generated."
        );

    } catch (error) {

        showToast(
            error.message
        );

    } finally {

        button.disabled = false;

        button.textContent =
            "✦ Generate Variation";

    }
}


async function uploadPDF(file) {

    if (!file) return;

    setStatus(
        "Analyzing PDF..."
    );

    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    try {

        const response =
            await fetch(
                `${API_BASE}/upload-brief`,
                {
                    method: "POST",
                    body: formData
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            throw new Error(
                data.message ||
                "PDF analysis failed."
            );

        }

        pdfContent =
            data.concept?.concept ||
            JSON.stringify(
                data.concept || ""
            );

        ideaInput.value =
            data.concept?.name
                ? `Create a creative concept based on this PDF:\n\n${data.concept.name}`
                : "Create a creative concept based on the uploaded PDF.";

        setStatus(
            `${file.name} analyzed successfully.`
        );

        showToast(
            "PDF analyzed successfully."
        );

    } catch (error) {

        showToast(
            error.message
        );

        setStatus("");

    }
}


async function analyzeImage(file) {

    if (!file) return;

    setStatus(
        "Analyzing reference image..."
    );

    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    try {

        const response =
            await fetch(
                `${API_BASE}/analyze-reference-image`,
                {
                    method: "POST",
                    body: formData
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            throw new Error(
                data.message ||
                "Image analysis failed."
            );

        }

        referenceAnalysis =
            data.analysis;

        setStatus(
            `${file.name} analyzed successfully.`
        );

        showToast(
            "Reference image understood."
        );

    } catch (error) {

        showToast(
            error.message
        );

        setStatus("");

    }
}


async function toggleRecording() {

    if (isRecording) {

        mediaRecorder.stop();

        return;
    }

    try {

        const stream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio: true
                });

        audioChunks = [];

        mediaRecorder =
            new MediaRecorder(
                stream
            );

        mediaRecorder.ondataavailable =
            event => {

                if (
                    event.data.size > 0
                ) {

                    audioChunks.push(
                        event.data
                    );

                }

            };

        mediaRecorder.onstop =
            async () => {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

                const audioBlob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                "audio/webm"
                        }
                    );

                await transcribeVoice(
                    audioBlob
                );

            };

        mediaRecorder.start();

        isRecording = true;

        document.getElementById(
            "voiceIcon"
        ).textContent = "■";

        document.getElementById(
            "voiceTitle"
        ).textContent =
            "Stop Recording";

        document.getElementById(
            "voiceSubtitle"
        ).textContent =
            "Recording...";

        setStatus(
            "Listening..."
        );

    } catch (error) {

        showToast(
            "Microphone permission is required."
        );

    }
}


async function transcribeVoice(
    audioBlob
) {

    setStatus(
        "Transcribing voice..."
    );

    const formData =
        new FormData();

    formData.append(
        "file",
        audioBlob,
        "voice.webm"
    );

    try {

        const response =
            await fetch(
                `${API_BASE}/transcribe-audio`,
                {
                    method: "POST",
                    body: formData
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            throw new Error(
                data.message ||
                "Voice transcription failed."
            );

        }

        const transcript =
            data.transcript || "";

        ideaInput.value =
            ideaInput.value.trim()
                ? `${ideaInput.value.trim()}\n\n${transcript}`
                : transcript;

        setStatus(
            "Voice added to your idea."
        );

        showToast(
            "Voice transcribed successfully."
        );

    } catch (error) {

        showToast(
            error.message
        );

        setStatus("");

    } finally {

        isRecording = false;

        document.getElementById(
            "voiceIcon"
        ).textContent = "◉";

        document.getElementById(
            "voiceTitle"
        ).textContent =
            "Record Voice";

        document.getElementById(
            "voiceSubtitle"
        ).textContent =
            "Speak your idea";

    }
}


function downloadImage() {

    if (!currentImageUrl) {

        showToast(
            "No image available."
        );

        return;
    }

    const link =
        document.createElement("a");

    link.href =
        currentImageUrl;

    link.download =
        `${
            currentBrief?.name ||
            "ascent-ai-creation"
        }.png`;

    link.click();
}


function showImagePrompt() {

    if (!currentImagePrompt) {

        showToast(
            "No image prompt available."
        );

        return;
    }

    openModal(
        "Image Generation Prompt",
        `
        <pre>${escapeHtml(
            JSON.stringify(
                currentImagePrompt,
                null,
                2
            )
        )}</pre>
        `
    );
}


function newCreation() {

    ideaInput.value = "";

    pdfContent = "";

    referenceAnalysis = null;

    currentBrief = null;

    currentImagePrompt = null;

    currentImageUrl = null;

    resultsSection.style.display =
        "none";

    resultsContainer.innerHTML =
        "";

    setStatus("");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function saveRecentCreation(
    imageUrl,
    name
) {

    const creations =
        JSON.parse(
            localStorage.getItem(
                "ascent_recent_creations"
            ) || "[]"
        );

    creations.unshift({
        image: imageUrl,
        name: name,
        date:
            new Date()
                .toLocaleDateString()
    });

    const limited =
        creations.slice(0, 8);

    localStorage.setItem(
        "ascent_recent_creations",
        JSON.stringify(limited)
    );

    renderRecentCreations();
}


function renderRecentCreations() {

    const creations =
        JSON.parse(
            localStorage.getItem(
                "ascent_recent_creations"
            ) || "[]"
        );

    recentCount.textContent =
        `${creations.length} creation${
            creations.length === 1
                ? ""
                : "s"
        }`;

    if (!creations.length) {

        recentGrid.innerHTML = `

            <div class="empty-recent">

                Your generated creations
                will appear here.

            </div>

        `;

        return;
    }

    recentGrid.innerHTML =
        creations
            .map(
                (creation, index) => `

                    <div
                        class="recent-card"
                        onclick="openRecent(${index})"
                    >

                        <img
                            src="${creation.image}"
                            alt="Recent creation"
                        >

                        <div class="recent-info">

                            <div class="recent-name">
                                ${escapeHtml(
                                    creation.name
                                )}
                            </div>

                            <div class="recent-date">
                                ${escapeHtml(
                                    creation.date
                                )}
                            </div>

                        </div>

                    </div>

                `
            )
            .join("");
}


function openRecent(index) {

    const creations =
        JSON.parse(
            localStorage.getItem(
                "ascent_recent_creations"
            ) || "[]"
        );

    const creation =
        creations[index];

    if (!creation) return;

    openModal(
        creation.name,
        `
        <img
            src="${creation.image}"
            style="
                width:100%;
                border-radius:12px;
                display:block;
            "
        >
        `
    );
}


function showHome() {

    document
        .getElementById("creator")
        .scrollIntoView({
            behavior: "smooth"
        });
}


function focusCreator() {

    document
        .getElementById("ideaInput")
        .focus();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function showGallery() {

    document
        .querySelector(
            ".results-section:last-child"
        )
        .scrollIntoView({
            behavior: "smooth"
        });
}


function showHistory() {

    const creations =
        JSON.parse(
            localStorage.getItem(
                "ascent_recent_creations"
            ) || "[]"
        );

    openModal(
        "Creation History",

        creations.length

            ? `
                <div>

                    ${
                        creations
                            .map(
                                creation => `
                                    <div style="
                                        padding:12px 0;
                                        border-bottom:
                                            1px solid #e8eeea;
                                    ">

                                        <strong>
                                            ${escapeHtml(
                                                creation.name
                                            )}
                                        </strong>

                                        <div style="
                                            font-size:11px;
                                            color:#8b9691;
                                            margin-top:3px;
                                        ">

                                            ${escapeHtml(
                                                creation.date
                                            )}

                                    </div>
                                `
                            )
                            .join("")
                    }

                </div>
            `

            : "<p>No creations yet.</p>"
    );
}


function showSettings() {

    openModal(
        "Settings",

        `
        <p>
            Ascent AI is currently running
            in local development mode.
        </p>

        <p style="margin-top:12px;">
            Backend:
            <strong>FastAPI</strong>
        </p>

        <p>
            AI:
            <strong>Groq + Hugging Face</strong>
        </p>

        <p>
            Frontend:
            <strong>HTML / CSS / JavaScript</strong>
        </p>
        `
    );
}


function openModal(
    title,
    content
) {

    document.getElementById(
        "modalTitle"
    ).textContent = title;

    document.getElementById(
        "modalContent"
    ).innerHTML = content;

    document.getElementById(
        "modal"
    ).classList.add("show");
}


function closeModal() {

    document.getElementById(
        "modal"
    ).classList.remove("show");
}


document.getElementById(
    "modal"
).addEventListener(
    "click",
    event => {

        if (
            event.target.id ===
            "modal"
        ) {

            closeModal();

        }

    }
);


function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


renderRecentCreations();

</script>
